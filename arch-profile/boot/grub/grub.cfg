# AppleOS — Ventoy entry point (also works for direct GRUB loopback boot).
# Ventoy prefers this file over its broken auto-generated menu.
# NOTE: @APPLEOS_UUID@ is substituted by scripts/inject-ventoy-grub.sh;
# it must match boot/<uuid>.uuid or the archiso hook won't find the ISO.
search --no-floppy --file /arch/boot/x86_64/vmlinuz-linux --set=root

menuentry "AppleOS install medium" {
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisosearchuuid=@APPLEOS_UUID@
    initrd /arch/boot/x86_64/initramfs-linux.img
}

menuentry "AppleOS install medium (verbose)" {
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisosearchuuid=@APPLEOS_UUID@ debug
    initrd /arch/boot/x86_64/initramfs-linux.img
}
