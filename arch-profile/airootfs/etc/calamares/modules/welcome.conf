---
# Приветственный экран. Интернет НЕ обязателен: установка работает офлайн
# (ставится live-система с COSMIC), сеть нужна только для докачки DE/пакетов.
requirements:
  requiredStorage: 8.0
  requiredRam: 2.0
  internetCheckEnabled: false
  check:
  - storage
  - ram
  - power
  - firmware
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: false
