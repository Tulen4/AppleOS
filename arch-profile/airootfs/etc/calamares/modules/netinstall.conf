---
# AppleOS: desktop and shell choice (netinstall step, like archinstall).
# Default: Apple Shell + bash. Needs internet (live Wi-Fi is fine).
- name: "desktops"
  description: "Desktop (default: COSMIC)"
  hidden: false
  critical: false
  packages:
  - name: "cosmic"
    description: "COSMIC — full desktop environment"
    selected: false
    critical: false
    packages: ["cosmic"]
  - name: "apple-shell"
    description: "Apple Shell — macOS-style desktop on labwc (AppleOS original)"
    selected: true
    critical: false
    packages: ["labwc", "waybar", "fuzzel", "mako", "swaybg", "swaylock", "swayidle", "grim", "slurp", "wl-clipboard", "cliphist", "foot", "polkit-gnome", "xdg-desktop-portal-wlr", "xdg-desktop-portal-gtk", "papirus-icon-theme", "inter-font", "ttf-jetbrains-mono", "ttf-jetbrains-mono-nerd", "noto-fonts-emoji", "brightnessctl", "pamixer", "pavucontrol"]
  - name: "gnome"
    description: "GNOME"
    selected: false
    critical: false
    packages: ["gnome"]
  - name: "plasma"
    description: "KDE Plasma"
    selected: false
    critical: false
    packages: ["plasma"]
  - name: "xfce"
    description: "Xfce (lightweight)"
    selected: false
    critical: false
    packages: ["xfce4", "xfce4-goodies"]
  - name: "hyprland"
    description: "Hyprland (tiling Wayland compositor)"
    selected: false
    critical: false
    packages: ["hyprland", "kitty", "waybar", "wofi"]
  - name: "sway"
    description: "Sway (i3-compatible Wayland)"
    selected: false
    critical: false
    packages: ["sway", "foot", "waybar", "wofi"]
  - name: "i3"
    description: "i3 (tiling X11)"
    selected: false
    critical: false
    packages: ["i3-wm", "i3status", "i3lock", "rofi", "alacritty"]

- name: "shells"
  description: "Command shell (default: bash)"
  hidden: false
  critical: false
  packages:
  - name: "bash-appleos"
    description: "bash — the default shell"
    selected: true
    critical: false
    packages: ["bash"]
  - name: "zsh"
    description: "zsh (becomes the user shell if selected)"
    selected: false
    critical: false
    packages: ["zsh", "grml-zsh-config"]
  - name: "fish"
    description: "fish (becomes the user shell if selected)"
    selected: false
    critical: false
    packages: ["fish"]
