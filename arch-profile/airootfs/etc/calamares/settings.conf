# AppleOS 0.3.0 — настройки Calamares (GUI-установщик).
# База: Arch Linux. init по умолчанию: systemd (выбора нет — Arch-way).
# Загрузчик по умолчанию: grub. DE по умолчанию: COSMIC (шаг netinstall).
branding: appleos
prompt-install: false
window-width: 1280
window-height: 720
modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - netinstall
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - netinstall
  - bootloader
  - packages
  - contextualprocess
  - umount
- show:
  - finished
