# AppleOS — Calamares OFFLINE: install without internet (for VMs and bare metal).
# The live system is unpacked into the target as-is (COSMIC), no network needed at all.
# Run: sudo calamares -c /etc/calamares/settings_offline.conf
branding: appleos
prompt-install: false
window-width: 1280
window-height: 720
modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - bootloader
  - packages
  - contextualprocess
  - umount
- show:
  - finished
