---
# Welcome screen. Internet is NOT required: offline install works
# (the live COSMIC system is installed), network is only needed to fetch extra DEs/packages.
requirements:
  requiredStorage: 8.0
  requiredRam: 2.0
  internetCheckEnabled: false
  check:
  - storage
  - ram
  - power
  - firmware
showSupportUrl: true
showKnownIssuesUrl: true
showReleaseNotesUrl: false
