# AppleOS — Calamares ONLINE: network install (DE/WM/shell choice at the netinstall step).
# Run: sudo calamares -c /etc/calamares/settings_online.conf
branding: appleos
prompt-install: false
window-width: 1280
window-height: 720
modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - netinstall
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - netinstall
  - bootloader
  - packages
  - contextualprocess
  - umount
- show:
  - finished
