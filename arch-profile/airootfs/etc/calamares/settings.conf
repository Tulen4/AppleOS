# AppleOS 0.4.0 — Calamares settings (GUI installer).
# Base: Arch Linux. Default init: systemd (no choice — the Arch way).
# Default bootloader: grub. Default DE: COSMIC (netinstall step).
branding: appleos
prompt-install: false
window-width: 1280
window-height: 720
modules-search: [ local, /usr/lib/calamares/modules ]

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - netinstall
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - netinstall
  - bootloader
  - packages
  - contextualprocess
  - umount
- show:
  - finished
