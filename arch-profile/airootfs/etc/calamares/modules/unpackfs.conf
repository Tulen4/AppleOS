---
# Unpack the live system into the target (base layer; desktop packages
# arrive at the netinstall step, which needs internet).
# NOTE: the image is at <install_dir>/x86_64/, while kernel+initrd live
# under <install_dir>/boot/ — do NOT add /boot/ here (was a real bug).
unpack:
- source: "/run/archiso/bootmnt/arch/x86_64/airootfs.sfs"
  sourcefs: "squashfs"
  destination: ""
