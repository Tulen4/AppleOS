---
# AppleOS: default bootloader — GRUB (no choice).
efiBootLoader: "grub"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
installPath: "/boot"
timeout: "5"
grubProbe: "grub-probe --target=device /boot"
kernel: "/boot/vmlinuz-linux"
img: "/boot/initramfs-linux.img"
fallback: "/boot/initramfs-linux-fallback.img"
kernelLine: ", with Linux"
fallbackLine: ", with Linux (fallback)"
